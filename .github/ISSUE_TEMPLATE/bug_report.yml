name: Bug report
description: Report a reproducible implementation or documentation problem.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain the observed behavior and why it is a defect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible example, without secrets.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: List commands run and their results.
